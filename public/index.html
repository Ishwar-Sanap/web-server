<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple web page served by a C++ web framework.">
    <title>Hello from C++</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="card">
        <div class="content">
            <p class="eyebrow">Web server demo</p>
            <h1>Hello, world.</h1>
            <p class="description">This page is being served by a web server written in C++.</p>
            <button id="hello-button" type="button">Say hello</button>
            <p id="message" class="message" aria-live="polite"></p>
        </div>
        <div class="image-container">
            <img src="/assets/template.png" alt="C++ code snippet">
        </div>
    </main>
    <script src="/app.js" defer></script>
</body>
</html>
